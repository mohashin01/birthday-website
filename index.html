<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Happy Birthday Maria 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- STAGE 1: INTRO -->
<section id="stage-intro" class="stage active">
  <div class="floating-hearts" id="floatingHearts"></div>
  <div class="intro-box">
    <h1 id="typedText" class="typed-text"></h1>
    <button id="yesBtn" class="btn btn-primary hidden">Yes 💖</button>
  </div>
</section>

<!-- STAGE 2: SCRATCH CARDS -->
<section id="stage-scratch" class="stage">
  <h2 class="stage-title">তোমার Birthday টা খুঁজে বের করো ✨</h2>
  <p class="stage-sub">প্রতিটা কার্ড আঙুল দিয়ে ঘষো</p>
  <div class="scratch-wrap">
    <div class="scratch-card" data-answer="15">
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-answer">15</div>
      <span class="scratch-label">Date</span>
    </div>
    <div class="scratch-card" data-answer="September">
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-answer">September</div>
      <span class="scratch-label">Month</span>
    </div>
    <div class="scratch-card" data-answer="❤">
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-answer">❤</div>
      <span class="scratch-label">Year</span>
    </div>
  </div>
</section>

<!-- STAGE 3: BIRTHDAY REVEAL -->
<section id="stage-reveal" class="stage">
  <div class="reveal-box">
    <h1 class="reveal-title">It's your birthday! 🎉</h1>
    <p class="reveal-sub">Happy Birthday Maria</p>
    <button id="toTreeBtn" class="btn btn-primary">Click here ↓</button>
  </div>
</section>

<!-- STAGE 4: MEMORY TREE -->
<section id="stage-tree" class="stage">
  <h2 class="stage-title">আমাদের স্মৃতির গাছ 🌳</h2>
  <p class="stage-sub">যেকোনো ছবিতে ট্যাপ করো</p>
  <div id="treeContainer" class="tree-container">
    <svg id="treeSvg" viewBox="0 0 400 300" class="tree-svg">
      <path d="M195,300 C190,250 185,220 190,190 C175,170 160,165 150,140 M190,190 C210,165 225,160 240,135 M192,220 C170,205 150,200 135,180 M198,220 C225,205 245,200 265,182 M195,170 C195,150 195,130 195,110"
        stroke="#6b4226" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M195,300 C193,270 197,260 195,240" stroke="#6b4226" stroke-width="16" fill="none" stroke-linecap="round"/>
    </svg>
    <div id="canopy" class="canopy"></div>
  </div>
  <button id="toCakeBtn" class="btn btn-primary hidden">One more surprise 🎁</button>
</section>

<!-- PHOTO MODAL -->
<div id="photoModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="flip-card" id="flipCard">
    <div class="flip-inner">
      <div class="flip-front">
        <img id="modalImg" src="" alt="memory" />
        <span class="turn-hint">turn ↻</span>
      </div>
      <div class="flip-back">
        <p id="modalQuote" class="quote-text"></p>
      </div>
    </div>
  </div>
  <button id="closeModal" class="btn btn-close">✕</button>
</div>

<!-- STAGE 5: CAKE -->
<section id="stage-cake" class="stage">
  <h2 class="stage-title" id="cakeTitle">কেকটা কাটো তো 🎂</h2>
  <div class="cake-wrap">
    <svg id="cakeSvg" viewBox="0 0 300 260" class="cake-svg">
      <ellipse cx="150" cy="230" rx="110" ry="18" fill="#f3c6d6"/>
      <rect x="55" y="150" width="190" height="70" rx="10" fill="#f8dbe6" class="cake-half cake-left"/>
      <rect x="55" y="150" width="190" height="70" rx="10" fill="#f8dbe6" class="cake-half cake-right"/>
      <rect x="70" y="100" width="160" height="60" rx="8" fill="#fdeef5" class="cake-half cake-left"/>
      <rect x="70" y="100" width="160" height="60" rx="8" fill="#fdeef5" class="cake-half cake-right"/>
      <g class="candles">
        <rect x="140" y="65" width="8" height="35" fill="#f7a8c4"/>
        <path class="flame" d="M144,65 C140,58 148,52 144,45 C150,52 148,60 144,65 Z" fill="#ffb703"/>
        <rect x="110" y="75" width="8" height="25" fill="#a8d0f7"/>
        <path class="flame" d="M114,75 C110,68 118,62 114,55 C120,62 118,70 114,75 Z" fill="#ffb703"/>
        <rect x="180" y="75" width="8" height="25" fill="#c3a8f7"/>
        <path class="flame" d="M184,75 C180,68 188,62 184,55 C190,62 188,70 184,75 Z" fill="#ffb703"/>
      </g>
      <line id="knifeLine" x1="150" y1="90" x2="150" y2="230" stroke="transparent" stroke-width="0"/>
    </svg>
    <div class="knife" id="knife">🔪</div>
    <p class="cake-hint" id="cakeHint">কেকের ওপর দিয়ে আঙুল টেনে নাও ছুরির মতো</p>
  </div>
</section>

<!-- STAGE 6: FINALE -->
<section id="stage-finale" class="stage">
  <div class="finale-box">
    <h1 class="finale-title">Happy Birthday<br>Maria</h1>
    <p class="finale-sub">I love you ❤️</p>
  </div>
</section>

<script src="js/photos-data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
